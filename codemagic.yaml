workflows:
  xtool-build:
    name: Build TienDat IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install xtool
        script: |
          if ! command -v xtool >/dev/null 2>&1; then
            brew install xtool-org/tap/xtool
          fi
          xtool --version
      - name: Validate app configuration
        script: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist
          test -f Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Build IPA
        script: |
          set -euo pipefail
          xtool dev build --ipa
      - name: Verify IPA artifact
        script: |
          set -euo pipefail
          IPA_PATH="$(find . -type f -name '*.ipa' -not -path './.git/*' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo 'ERROR: Build completed but no IPA file was produced.'
            exit 1
          fi
          echo "IPA produced: $IPA_PATH"
          unzip -t "$IPA_PATH"
    artifacts:
      - '**/*.ipa'
      - '*.ipa'
